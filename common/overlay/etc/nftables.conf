#!/usr/sbin/nft -f
# Firewall di base (articolo 4): in ingresso tutto chiuso tranne SSH e ciò che
# aprono i profili in /etc/nftables.d/*.nft (aggiungendo porte ai set).
flush ruleset

table inet filter {
	set tcp_in {
		type inet_service
		elements = { 22 }
	}
	set udp_in {
		type inet_service
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state invalid drop
		ct state established,related accept
		iif "lo" accept
		# ICMP essenziale; senza neighbor discovery IPv6 non funziona
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# Risposte DHCPv6 (arrivano da link-local, non sono tracciate come risposte)
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
		tcp dport @tcp_in accept
		udp dport @udp_in accept
		jump profile_in
		limit rate 5/minute log prefix "nft-drop: " level info
	}

	# Regole più specifiche dei profili (es. porta aperta solo ad alcuni indirizzi)
	chain profile_in {
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
