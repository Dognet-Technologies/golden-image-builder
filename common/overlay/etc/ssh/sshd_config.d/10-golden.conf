# Hardening di sshd (articolo 4). Il file principale di Debian include questa
# directory all'inizio e per sshd vale il PRIMO valore letto: questi vincono.

# Autenticazione: solo chiave pubblica
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60

# Algoritmi moderni (OpenSSH 10): scambio di chiavi ibrido post-quantistico in testa
HostKeyAlgorithms ssh-ed25519
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,curve25519-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,rsa-sha2-512,rsa-sha2-256

# Niente inoltri, tunnel, X11, variabili d'ambiente dell'utente. DisableForwarding
# basterebbe, ma sshd -T (e gli strumenti di audit) mostrano anche le singole opzioni
DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no

# Sessioni inattive chiuse dopo 10 minuti (ClientAlive passa nel canale cifrato,
# TCPKeepAlive no); al massimo 2 sessioni per connessione
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
MaxSessions 2

# Avviso legale prima dell'autenticazione
Banner /etc/issue.net

# Log con l'impronta della chiave usata: chi è entrato, anche come root
LogLevel VERBOSE
