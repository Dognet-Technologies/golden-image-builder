# Moduli che un server non deve caricare (articolo 3).
# "blacklist" evita il caricamento automatico (alias, udev) senza errori nel log;
# "install <modulo> /bin/false" blocca anche il caricamento esplicito.
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist n_hdlc
install n_hdlc /bin/false
blacklist ax25
install ax25 /bin/false
