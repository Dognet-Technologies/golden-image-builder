# /etc è in sola lettura e ogni avvio può risultare "primo": generiamo la chiave
# in /var una sola volta, la prima volta che manca
[Unit]
ConditionFirstBoot=
ConditionPathIsReadWrite=
ConditionPathIsSymbolicLink=
ConditionPathExists=!/var/lib/ssh/ssh_host_ed25519_key
RequiresMountsFor=/var/lib/ssh

[Service]
ExecStartPre=install -d -m 0755 /var/lib/ssh
ExecStart=
ExecStart=ssh-keygen -q -t ed25519 -N "" -C "" -f /var/lib/ssh/ssh_host_ed25519_key
