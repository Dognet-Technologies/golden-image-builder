# Sandboxing di nginx (articolo 6). Il master parte come root solo per aprire le
# porte 80/443 e leggere il certificato; i worker girano come www-data.
[Service]
ImportCredential=golden.tls.*
RuntimeDirectory=nginx-golden
ExecStartPre=
ExecStartPre=/usr/libexec/golden/nginx-tls
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'

# File system: tutto in sola lettura tranne log, cache e PID
ProtectSystem=strict
ReadWritePaths=/var/log/nginx /var/lib/nginx /run
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid

# Privilegi: solo le capability che servono al master
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_KILL
NoNewPrivileges=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RemoveIPC=yes

# Chiamate di sistema e rete
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @obsolete
# worker_cpu_affinity auto (nginx.conf di Debian) usa sched_setaffinity, che sta in
# @resources: senza questa riga i worker muoiono con SIGSYS (segnale 31)
SystemCallFilter=sched_setaffinity
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
UMask=0027
