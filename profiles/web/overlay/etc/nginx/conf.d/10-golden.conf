# Hardening HTTP comune a tutti i server (articolo 6). server_tokens off e
# ssl_protocols TLSv1.2 TLSv1.3 sono già nel nginx.conf di Debian.
ssl_session_tickets off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Limiti contro richieste abnormi e connessioni lente
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 10s;
large_client_header_buffers 4 8k;

# Intestazioni di sicurezza
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

# HTTPS (porta 443) solo se all'avvio arriva un certificato come credential:
# il file lo scrive /usr/libexec/golden/nginx-tls in /run/nginx-golden/
include /run/nginx-golden/*.conf;
