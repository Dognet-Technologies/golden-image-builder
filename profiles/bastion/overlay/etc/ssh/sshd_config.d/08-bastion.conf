# Bastion (articolo 7): serve l'inoltro TCP locale per "ssh -J" (ProxyJump).
# Letto prima di 10-golden.conf: questi valori vincono. Tutto il resto resta chiuso.
DisableForwarding no
AllowTcpForwarding local
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
