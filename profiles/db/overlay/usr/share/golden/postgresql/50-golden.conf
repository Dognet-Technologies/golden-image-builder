# Configurazione del profilo db (articolo 6), copiata in conf.d al primo avvio
listen_addresses = '*'
password_encryption = 'scram-sha-256'
log_connections = on
log_disconnections = on
ssl = off
# TLS solo se il certificato arriva come credential (/usr/libexec/golden/postgresql-tls)
include_if_exists = '/run/postgresql/golden-tls.conf'
