# Sandboxing di PostgreSQL (articolo 6). pg_ctlcluster parte come root e passa
# all'utente postgres: niente capability oltre a quelle per farlo.
[Unit]
Wants=golden-postgresql-init.service
After=golden-postgresql-init.service

[Service]
ImportCredential=golden.tls.*
ExecStartPre=/usr/libexec/golden/postgresql-tls

ProtectSystem=strict
ReadWritePaths=/var/lib/postgresql /var/log/postgresql /run/postgresql
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_KILL
NoNewPrivileges=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@obsolete
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
UMask=0077
